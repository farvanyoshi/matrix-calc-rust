[package]
name = "matrix-calc"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Generic dense matrices and real numerical linear algebra"
repository = "https://github.com/farvanyoshi/matrix-calc-rust"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
num-traits = "0.2"
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
proptest = "=1.6.0"
serde_json = "1"

[[bench]]
name = "kernels"
harness = false
