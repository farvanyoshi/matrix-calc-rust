[package]
name = "matrix-calc"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Dense matrices, vectors, strided tensors, numerical linear algebra and a calculator REPL"
repository = "https://github.com/farvanyoshi/matrix-calc-rust"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
num-traits = "0.2"
rayon = "1.10"
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
criterion = "0.5"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
proptest = "=1.6.0"
serde_json = "1"

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "roadmap"
harness = false
